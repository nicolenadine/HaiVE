scaffold_agent:
  description: "Generates project structure, directory layout, and boilerplate files from a task specification."
  skills:
    - "create directory structure"
    - "write boilerplate files"
    - "initialize configuration files"
    - "set up package structure"
  system_prompt: "prompts/scaffold_agent.md"
  output_schema: "schemas/scaffold_output.json"
  max_tokens: 4096
  retry_limit: 2
  prompt_version: "1.0"

implementation_agent:
  description: "Writes production code to implement a feature or module from a specification."
  skills:
    - "implement features from specification"
    - "write production-quality code"
    - "follow existing code patterns"
    - "handle edge cases and error paths"
  system_prompt: "prompts/implementation_agent.md"
  output_schema: "schemas/implementation_output.json"
  max_tokens: 16384
  retry_limit: 2
  prompt_version: "1.0"

code_editor_agent:
  description: "Makes targeted edits to existing code files with minimal surrounding changes."
  skills:
    - "apply precise edits to existing files"
    - "preserve surrounding context"
    - "follow file-local conventions"
    - "avoid unrelated reformatting"
  system_prompt: "prompts/code_editor_agent.md"
  output_schema: "schemas/code_editor_output.json"
  max_tokens: 16384
  retry_limit: 2
  prompt_version: "1.0"
  context_budget_multiplier: 2.0

refactoring_agent:
  description: "Refactors existing code for clarity, testability, or performance without changing behaviour."
  skills:
    - "extract functions and classes"
    - "rename for clarity"
    - "remove duplication"
    - "simplify control flow"
  system_prompt: "prompts/refactoring_agent.md"
  output_schema: "schemas/refactoring_output.json"
  max_tokens: 8192
  retry_limit: 2
  prompt_version: "1.0"

api_integration_agent:
  description: "Integrates with external APIs by writing HTTP clients, adapters, and data-mapping code."
  skills:
    - "write HTTP client code"
    - "implement adapter patterns"
    - "map external schemas to internal models"
    - "handle authentication and retries"
  system_prompt: "prompts/api_integration_agent.md"
  output_schema: "schemas/api_integration_output.json"
  max_tokens: 8192
  retry_limit: 2
  prompt_version: "1.0"

database_agent:
  description: "Writes database schemas, migrations, models, and query code for relational or document stores."
  skills:
    - "design database schemas"
    - "write migrations"
    - "implement repository or DAO patterns"
    - "write efficient queries"
  system_prompt: "prompts/database_agent.md"
  output_schema: "schemas/database_output.json"
  max_tokens: 8192
  retry_limit: 2
  prompt_version: "1.0"

test_generator_agent:
  description: "Generates unit, integration, and end-to-end tests for a given module or feature."
  skills:
    - "write unit tests"
    - "write integration tests"
    - "identify edge cases and failure modes"
    - "mock external dependencies"
  system_prompt: "prompts/test_generator_agent.md"
  output_schema: "schemas/test_generator_output.json"
  max_tokens: 8192
  retry_limit: 2
  prompt_version: "1.0"

code_reviewer_agent:
  description: "Reviews code for correctness, style, and adherence to acceptance criteria."
  skills:
    - "evaluate correctness against requirements"
    - "identify logic errors and edge cases"
    - "assess code style and readability"
    - "produce structured review verdicts"
  system_prompt: "prompts/code_reviewer_agent.md"
  output_schema: "schemas/review_verdict.json"
  max_tokens: 4096
  retry_limit: 1
  prompt_version: "1.1"

security_reviewer_agent:
  description: "Reviews code for security vulnerabilities, unsafe patterns, and exposure of sensitive data."
  skills:
    - "identify injection vulnerabilities"
    - "detect insecure data handling"
    - "flag exposed secrets or credentials"
    - "assess authentication and authorisation logic"
  system_prompt: "prompts/security_reviewer_agent.md"
  output_schema: "schemas/review_verdict.json"
  max_tokens: 4096
  retry_limit: 1
  prompt_version: "1.0"

documentation_writer_agent:
  description: "Writes technical documentation, docstrings, README sections, and usage examples."
  skills:
    - "write module and function docstrings"
    - "author README sections"
    - "produce usage examples"
    - "document API contracts"
  system_prompt: "prompts/documentation_writer_agent.md"
  output_schema: "schemas/documentation_output.json"
  max_tokens: 4096
  retry_limit: 2
  prompt_version: "1.0"
