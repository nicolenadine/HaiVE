examples:

  - id: missing_files_before_validation
    pattern_name: Missing files before validation
    tags:
      - new_files_required
      - validation_logic
    use_when:
      - Validation depends on files or resources that may not exist yet
      - The system will fail if validation logic runs before referenced files are created
    do_not_use_when:
      - All required files already exist and only the validation logic itself needs changing
    default_task_graph:
      - agent_role: scaffold_agent
        purpose: Create missing files or resources
        complexity: low
        depends_on: []
      - agent_role: code_editor_agent
        purpose: Modify existing working code to add validation
        complexity: medium
        depends_on: ["0"]
      - agent_role: test_generator_agent
        purpose: Add tests for validation behavior
        complexity: medium
        depends_on: ["0", "1"]
    common_wrong_outputs:
      - Using implementation_agent for existing-code validation (use code_editor_agent instead)
      - Allowing scaffold and code edit to run in parallel when the edit depends on scaffolded files
      - Adding code_reviewer_agent as a generic final gate (executor already runs internal review)
    mini_example:
      milestone: Add input validation to an existing API handler when the validation schema file does not yet exist
      expected_tasks:
        - title: Create validation schema file
          agent_role: scaffold_agent
          complexity: low
          depends_on: []
        - title: Add validation logic to handler
          agent_role: code_editor_agent
          complexity: medium
          depends_on: ["0"]
        - title: Add validation tests
          agent_role: test_generator_agent
          complexity: medium
          depends_on: ["0", "1"]

  - id: existing_code_validation_change
    pattern_name: Existing-code validation change
    tags:
      - existing_code_edit
      - validation_logic
    use_when:
      - Modifying existing working code to add or tighten validation
      - No new files are required before the change can be made
    do_not_use_when:
      - Required files do not exist yet (use missing_files_before_validation instead)
    default_task_graph:
      - agent_role: code_editor_agent
        purpose: Modify existing code to add validation logic
        complexity: medium
        depends_on: []
      - agent_role: test_generator_agent
        purpose: Add or update tests for the validation behavior
        complexity: medium
        depends_on: ["0"]
    common_wrong_outputs:
      - Using implementation_agent because the task says "implement" — if the code already exists, use code_editor_agent
      - Forgetting that tests depend on the code edit and creating them as a parallel task
      - Adding a scaffold task when no new files are needed
    mini_example:
      milestone: Tighten email validation in the existing user registration handler
      expected_tasks:
        - title: Add stricter email validation to registration handler
          agent_role: code_editor_agent
          complexity: medium
          depends_on: []
        - title: Add tests for email validation edge cases
          agent_role: test_generator_agent
          complexity: medium
          depends_on: ["0"]

  - id: new_module_with_stubs
    pattern_name: New module with stubs
    tags:
      - new_files_required
      - new_module
      - stub_implementation
    use_when:
      - New files, interfaces, or classes need to be created before logic can be added
      - A skeleton or scaffold is required first so implementation has a target to fill in
    do_not_use_when:
      - The module already exists (use existing_code_edit pattern instead)
    default_task_graph:
      - agent_role: scaffold_agent
        purpose: Create new files, directory structure, and stub interfaces
        complexity: low
        depends_on: []
      - agent_role: implementation_agent
        purpose: Fill in logic inside the scaffolded stubs
        complexity: medium
        depends_on: ["0"]
      - agent_role: test_generator_agent
        purpose: Add tests for the new module behavior
        complexity: medium
        depends_on: ["0", "1"]
    common_wrong_outputs:
      - Using code_editor_agent before files exist
      - Using implementation_agent directly without scaffolding first
      - Combining scaffold and implementation into one large task
    mini_example:
      milestone: Add a new CacheManager module that does not yet exist
      expected_tasks:
        - title: Scaffold CacheManager module with stub interface
          agent_role: scaffold_agent
          complexity: low
          depends_on: []
        - title: Implement CacheManager logic
          agent_role: implementation_agent
          complexity: medium
          depends_on: ["0"]
        - title: Add tests for CacheManager
          agent_role: test_generator_agent
          complexity: medium
          depends_on: ["0", "1"]

  - id: cli_command_addition
    pattern_name: CLI command addition
    tags:
      - cli_change
    use_when:
      - Adding a new CLI command or modifying an existing one
      - The CLI structure (Typer app, command group) already exists
    do_not_use_when:
      - The CLI itself does not yet exist and needs to be created from scratch
    default_task_graph:
      - agent_role: code_editor_agent
        purpose: Add or modify the CLI command in the existing CLI module
        complexity: medium
        depends_on: []
      - agent_role: test_generator_agent
        purpose: Add tests for the CLI command behavior
        complexity: medium
        depends_on: ["0"]
      - agent_role: documentation_writer_agent
        purpose: Update help text or usage documentation if needed
        complexity: low
        depends_on: ["0"]
    common_wrong_outputs:
      - Creating unnecessary scaffold tasks when the CLI structure already exists
      - Adding a generic code_reviewer_agent task (executor runs review internally)
      - Making the docs task depend on tests rather than on the code change
    mini_example:
      milestone: Add a haive config reset command that clears the active config
      expected_tasks:
        - title: Add reset subcommand to config CLI
          agent_role: code_editor_agent
          complexity: medium
          depends_on: []
        - title: Add tests for the reset command
          agent_role: test_generator_agent
          complexity: medium
          depends_on: ["0"]
        - title: Update CLI help documentation
          agent_role: documentation_writer_agent
          complexity: low
          depends_on: ["0"]

  - id: database_migration
    pattern_name: Database migration
    tags:
      - database_migration
      - security_sensitive
    use_when:
      - Task involves schema migrations, ALTER TABLE, irreversible data operations, or index changes
      - Security or compliance review is required before migration runs
    do_not_use_when:
      - The change is a simple query or ORM model field with no schema migration needed
    default_task_graph:
      - agent_role: database_agent
        purpose: Write and validate the migration script
        complexity: high
        depends_on: []
      - agent_role: security_reviewer_agent
        purpose: Review migration for data loss risk, locking behavior, and compliance
        complexity: medium
        depends_on: ["0"]
      - agent_role: test_generator_agent
        purpose: Add tests verifying migration correctness and rollback safety
        complexity: medium
        depends_on: ["0"]
    common_wrong_outputs:
      - Routing migration work to code_editor_agent or implementation_agent
      - Omitting security review for irreversible or high-risk schema changes
      - Making tests depend on the security review rather than the migration itself
    mini_example:
      milestone: Add an index on users.email for faster login lookups
      expected_tasks:
        - title: Write migration to add index on users.email
          agent_role: database_agent
          complexity: high
          depends_on: []
        - title: Security review of migration for locking and rollback risk
          agent_role: security_reviewer_agent
          complexity: medium
          depends_on: ["0"]
        - title: Add tests verifying index creation and query performance
          agent_role: test_generator_agent
          complexity: medium
          depends_on: ["0"]
